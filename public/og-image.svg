<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Polemos Labs">
  <rect width="1200" height="630" fill="#08080a"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>

  <!-- Logo mark, centered horizontally, above the wordmark -->
  <g transform="translate(540 195) scale(1.2)">
    <path d="M 50 8 L 58 42 L 92 50 L 58 58 L 50 92 L 42 58 L 8 50 L 42 42 Z" fill="#e8d9c7"/>
  </g>

  <!-- Wordmark, centered horizontally -->
  <text x="600" y="450"
        text-anchor="middle"
        fill="#e8d9c7"
        font-family="Bricolage Grotesque, Instrument Sans, system-ui, sans-serif"
        font-size="78"
        font-weight="700"
        letter-spacing="2">POLEMOS LABS</text>

  <defs>
    <radialGradient id="bloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 220) rotate(125) scale(620 720)">
      <stop stop-color="#e8d9c7" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
