<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1400" height="760" fill="#F4EFE5"/>

  <text x="700" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#2A2A2A">AI pipeline for TP compliance</text>
  <text x="700" y="98" text-anchor="middle" font-size="16" font-family="Inter, system-ui, sans-serif" fill="#6B6B6B">Five stages, with a single eval + audit layer running underneath all of them.</text>

  <!-- Stages -->
  <g font-family="Inter, system-ui, sans-serif">
    <!-- 1 Sources -->
    <g>
      <rect x="60" y="160" width="240" height="380" rx="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
      <text x="180" y="200" text-anchor="middle" font-size="13" letter-spacing="2" fill="#C75D2C" font-weight="700">01 · SOURCES</text>
      <text x="180" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#1F3A5F" font-family="Georgia, serif">Sources</text>
      <g font-size="13" fill="#2A2A2A">
        <text x="80" y="275">ERP / GL</text>
        <text x="80" y="305">Intercompany agreements</text>
        <text x="80" y="335">Invoices &amp; contracts</text>
        <text x="80" y="365">Financial statements</text>
        <text x="80" y="395">OECD &amp; jurisdiction rules</text>
        <text x="80" y="425">Prior-year TP reports</text>
        <text x="80" y="455">TP databases (Orbis, etc.)</text>
      </g>
    </g>

    <!-- arrow -->
    <line x1="306" y1="350" x2="334" y2="350" stroke="#C75D2C" stroke-width="2.5"/>
    <polygon points="334,350 324,344 324,356" fill="#C75D2C"/>

    <!-- 2 Ingestion -->
    <g>
      <rect x="340" y="160" width="240" height="380" rx="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
      <text x="460" y="200" text-anchor="middle" font-size="13" letter-spacing="2" fill="#C75D2C" font-weight="700">02 · INGESTION</text>
      <text x="460" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#1F3A5F" font-family="Georgia, serif">Extract &amp; resolve</text>
      <g font-size="13" fill="#2A2A2A">
        <text x="360" y="275">Layout-aware OCR</text>
        <text x="360" y="305">Schema-bound extraction</text>
        <text x="360" y="335">Entity resolution</text>
        <text x="360" y="365">Reconciliation</text>
        <text x="360" y="395">Confidence scoring</text>
        <text x="360" y="425">Provenance: page + bbox</text>
      </g>
    </g>

    <line x1="586" y1="350" x2="614" y2="350" stroke="#C75D2C" stroke-width="2.5"/>
    <polygon points="614,350 604,344 604,356" fill="#C75D2C"/>

    <!-- 3 Canonical Store -->
    <g>
      <rect x="620" y="160" width="240" height="380" rx="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
      <text x="740" y="200" text-anchor="middle" font-size="13" letter-spacing="2" fill="#C75D2C" font-weight="700">03 · STORE</text>
      <text x="740" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#1F3A5F" font-family="Georgia, serif">Canonical store</text>
      <g font-size="13" fill="#2A2A2A">
        <text x="640" y="275">Typed transaction warehouse</text>
        <text x="640" y="305">Entity / ownership graph</text>
        <text x="640" y="335">Hybrid index (BM25 + dense)</text>
        <text x="640" y="365">Regulation library</text>
        <text x="640" y="395">Versioned snapshots</text>
      </g>
    </g>

    <line x1="866" y1="350" x2="894" y2="350" stroke="#C75D2C" stroke-width="2.5"/>
    <polygon points="894,350 884,344 884,356" fill="#C75D2C"/>

    <!-- 4 Agents -->
    <g>
      <rect x="900" y="160" width="240" height="380" rx="14" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
      <text x="1020" y="200" text-anchor="middle" font-size="13" letter-spacing="2" fill="#C75D2C" font-weight="700">04 · AGENTS</text>
      <text x="1020" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#1F3A5F" font-family="Georgia, serif">Agent layer</text>
      <g font-size="13" fill="#2A2A2A">
        <text x="920" y="275">FAR analyzer (DEMPE)</text>
        <text x="920" y="305">Comparables retriever</text>
        <text x="920" y="335">Method &amp; PLI selector</text>
        <text x="920" y="365">Section drafter</text>
        <text x="920" y="395">Review judge (LLM-as-judge)</text>
      </g>
    </g>

    <line x1="1146" y1="350" x2="1174" y2="350" stroke="#C75D2C" stroke-width="2.5"/>
    <polygon points="1174,350 1164,344 1164,356" fill="#C75D2C"/>

    <!-- 5 Human review -->
    <g>
      <rect x="1180" y="160" width="180" height="380" rx="14" fill="#FFFFFF" stroke="#C75D2C" stroke-width="2.5"/>
      <text x="1270" y="200" text-anchor="middle" font-size="13" letter-spacing="2" fill="#C75D2C" font-weight="700">05 · HUMAN</text>
      <text x="1270" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#1F3A5F" font-family="Georgia, serif">Review &amp; sign-off</text>
      <g font-size="13" fill="#2A2A2A">
        <text x="1200" y="275">TP manager queue</text>
        <text x="1200" y="305">Edit + approve flow</text>
        <text x="1200" y="335">Final report</text>
        <text x="1200" y="365">Sign-off → regulator</text>
      </g>
      <!-- Feedback arrow -->
      <text x="1270" y="430" text-anchor="middle" font-size="11" fill="#6B6B6B">Corrections feed back ↓</text>
    </g>
  </g>

  <!-- Bottom band: eval + audit -->
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="60" y="600" width="1300" height="100" rx="14" fill="#E8EDF3" stroke="#1F3A5F" stroke-width="2"/>
    <text x="710" y="638" text-anchor="middle" font-size="13" letter-spacing="2" fill="#C75D2C" font-weight="700">RUNS ACROSS ALL STAGES</text>
    <text x="710" y="672" text-anchor="middle" font-size="20" font-weight="700" fill="#1F3A5F" font-family="Georgia, serif">Eval harness · Audit log · Confidence routing · HITL gates</text>
  </g>
</svg>
