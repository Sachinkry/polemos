        <h1>Polemos Labs — Governed AI Systems for Operational Command</h1>
        <p>
          Polemos Labs is an applied AI studio. We turn fragmented data, manual review, and tool sprawl into
          governed AI systems that sense what matters and route the next move — keeping humans in command.
        </p>
        <nav>

      <section id="problem">
        <h2>The problem: command is hard</h2>
        <p>AI fails when it is bolted onto broken process. The hard work is the wiring.</p>
        <ol>
          <li>Workflow terrain mapped before model choice</li>
          <li>Private data connected with permissions intact</li>
          <li>Human command where risk is high</li>
          <li>Production telemetry from day one</li>
        </ol>
      </section>

      <section id="outcomes">
        <h2>What ships</h2>
        <article>
          <h3>Finance &amp; Operations — invoices move from inbox chaos to controlled exception queues</h3>
          <p>Ingest PDFs, emails, and ERP records; validate fields against policy; escalate only the decisions that need a human owner. Replace manual chasing with governed review loops.</p>
        </article>
        <article>
          <h3>Logistics &amp; Supply Chain — demand signals become procurement moves before pressure hits</h3>
          <p>Connect transaction history, supplier data, and live operational context so planners can act before bottlenecks become expensive. Turn forecasts into triggers, not another dashboard.</p>
        </article>
        <article>
          <h3>Professional Services — institutional knowledge becomes a cited analyst layer</h3>
          <p>Build retrieval, citation, and synthesis systems across contracts, research, tickets, and client records. Senior teams spend less time searching and more time deciding.</p>
        </article>
      </section>

      <section id="products">
        <h2>Implementation accelerators</h2>
        <article>
          <h3>OmniGraph — Grounded Retrieval Layer</h3>
          <p>Production retrieval stack. Answers grounded in your data, with citations.</p>
          <ul>
            <li>Hybrid search and rerank for high-precision recall</li>
            <li>Permission-aware grounding across your systems</li>
            <li>Eval harness for precision, recall, and faithfulness</li>
          </ul>
        </article>
        <article>
          <h3>NeuroTask — Supervised Agent Runtime</h3>
          <p>Graph-based agent runtime with typed tools and human approval gates.</p>
          <ul>
            <li>Supervisor and worker agents on a typed state graph</li>
            <li>Schema-validated tools, sandboxed and least privilege</li>
            <li>Human approvals on destructive actions, with full traces</li>
          </ul>
        </article>
      </section>

      <section id="services">
        <h2>Core services — built to ship</h2>
        <article>
          <h3>AI Opportunity Mapping</h3>
          <p>We identify the workflows worth automating, the data required, and the fastest route to measurable production value.</p>
        </article>
        <article>
          <h3>Ingestion, Retrieval &amp; Knowledge Graphs</h3>
          <p>Pipelines, indexing, permissions, and RAG systems that make internal data usable by people, agents, and decision systems.</p>
        </article>
        <article>
          <h3>Agentic Workflow Automation</h3>
          <p>Agents that execute bounded tasks, use tools, validate outputs, and hand off to humans at the right moment.</p>
        </article>
        <article>
          <h3>Model Deployment &amp; Tuning</h3>
          <p>Open-source model deployment, evaluation, fine-tuning, and monitoring for teams that need security, cost control, and auditability.</p>
        </article>
      </section>

      <section id="process">
        <h2>How we work — validate before scale</h2>
        <ol>
          <li><strong>01 / MAP — Discover (2 weeks):</strong> Map high-friction workflows, data readiness, risk, and ROI. You leave with a prioritized implementation brief.</li>
          <li><strong>02 / DESIGN — Plan (3 weeks):</strong> Define architecture, model strategy, integrations, evaluation sets, and human-in-the-loop controls before code.</li>
          <li><strong>03 / DEPLOY — Execute (4–6 weeks):</strong> Ship the first production workflow with ingestion, retrieval, agents, tests, observability, and real user feedback.</li>
          <li><strong>04 / EXPAND — Command (ongoing):</strong> Harden the system, expand to adjacent workflows, monitor quality and cost, and train your team to operate it.</li>
        </ol>
      </section>

      <section id="fit">
        <h2>Who we work with — real stakes only</h2>
        <ul>
          <li>You have a specific operational bottleneck with measurable cost, delay, or risk</li>
          <li>You own proprietary data that should become a strategic advantage</li>
          <li>You need secure deployment across existing tools, teams, and approval paths</li>
          <li>You measure success by business outcomes, not model benchmarks or prototypes</li>
          <li>You have the mandate to ship and a team ready to own the system after launch</li>
        </ul>
      </section>
